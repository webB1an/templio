name: Upload miniprogram

on:
  workflow_dispatch:
    inputs:
      version:
        description: 体验版版本号（如 0.1.0）
        required: true
        default: 0.1.0
      desc:
        description: 体验版描述
        required: false
        default: 模板宝 体验版

permissions:
  contents: read

jobs:
  upload:
    name: Upload to WeChat DevTools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: npm ci

      - name: Prepare upload key
        env:
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$WX_PRIVATE_KEY" ]; then
            echo "::error::未配置 WX_PRIVATE_KEY（小程序代码上传密钥 base64）"
            exit 1
          fi
          echo "$WX_PRIVATE_KEY" | base64 -d > /tmp/private.key
          test -s /tmp/private.key

      - name: Upload miniprogram
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY_PATH: /tmp/private.key
        run: |
          node scripts/upload-miniprogram.mjs \
            --version "${{ inputs.version }}" \
            --desc "${{ inputs.desc }}"
